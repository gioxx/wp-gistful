name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer lint

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        wp: [ '6.5', 'latest' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, dom, zip
          coverage: none
      - name: Pin WordPress core
        if: matrix.wp != 'latest'
        run: composer require --dev --no-update "johnpbloch/wordpress-core:${{ matrix.wp }}.*" "wp-phpunit/wp-phpunit:${{ matrix.wp }}.*"
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist
      - run: composer test
      # The whole suite again on a multisite install (uninstall loop over sites,
      # network-activated GistPress, super-admin capabilities).
      - name: PHPUnit (multisite)
        if: matrix.wp == 'latest' && matrix.php == '8.3'
        env:
          WP_MULTISITE: '1'
        run: composer test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build package
        run: bin/package.sh
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/gistful
