name: Release

# A new version in gistful.php on main publishes a GitHub release with the
# WordPress.org package (built by bin/package.sh) and the CHANGELOG section.
on:
  push:
    branches: [main]
    paths:
      - gistful.php
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 '^ \* Version:' gistful.php | sed -E 's/.*Version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: '24'
          cache: npm

      - name: Build plugin zip
        if: steps.check.outputs.exists == 'false'
        run: |
          bin/package.sh
          mv dist/gistful.zip "dist/gistful-${{ steps.version.outputs.version }}.zip"

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        run: |
          awk '/^## ${{ steps.version.outputs.version }}( |$)/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "See CHANGELOG.md." > /tmp/release-notes.md
          fi
          {
            echo ""
            echo "For the full version history, see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          } >> /tmp/release-notes.md

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/gistful-${{ steps.version.outputs.version }}.zip" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md
